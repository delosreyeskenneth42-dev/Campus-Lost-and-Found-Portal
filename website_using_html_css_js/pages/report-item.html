<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Report Item | Campus Lost and Found Portal</title>
    <link rel="stylesheet" type="text/css" href="../css/main.css" />
    <link rel="stylesheet" type="text/css" href="../css/responsive.css" />
    <link rel="stylesheet" type="text/css" href="../css/print.css" media="print" />
</head>

<body>
    <div class="site-header">
        <div class="site-brand">
            <img src="../assets/images/dorsu-logo.png" alt="DOrSU Logo" />
            <h1>Campus Lost and Found Portal</h1>
        </div>

        <div class="site-nav">
            <a class="nav-link" href="../index.html">Home</a>
            <a class="about-link" href="about.html">About Us</a>
        </div>
    </div>

    <div class="page-main">
        <div class="content-section report-section">

            <h2>Report an Item</h2>

            <p>Provide the necessary details about the lost or found item.</p>

            <form id="report-form" action="#" method="post">

                <div class="form-group">
                    <label for="item-type">Report Type</label>

                    <select id="item-type" name="item-type">
                        <option value="">Select report type</option>
                        <option value="lost">Lost Item</option>
                        <option value="found">Found Item</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="item-name">Item Name</label>
                    <input type="text" id="item-name" name="item-name" />
                </div>

                <div class="form-group">
                    <label for="item-category">Category</label>

                    <select id="item-category" name="item-category">
                        <option value="">Select category</option>
                        <option value="personal">Personal Belongings</option>
                        <option value="identification">Identification</option>
                        <option value="electronics">Electronics</option>
                        <option value="documents">Documents</option>
                        <option value="others">Others</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="item-description">Description</label>
                    <textarea id="item-description" name="item-description" rows="5" cols="30"></textarea>
                </div>

                <div class="form-group">
                    <label for="item-location">Location</label>
                    <input type="text" id="item-location" name="item-location" />
                </div>

                <div class="form-group">
                    <label for="item-date">Date Lost or Found</label>
                    <input type="text" id="item-date" name="item-date" />
                </div>

                <div class="form-group">
                    <label for="reporter-contact">Contact Information</label>
                    <input type="text" id="reporter-contact" name="reporter-contact" />
                </div>

                <div class="form-actions">
                    <input type="submit" value="Submit Report" />
                </div>

            </form>

        </div>
    </div>

    <div class="site-footer">
        <p>&#169; Campus Lost and Found Portal. All rights reserved.</p>
    </div>
</body>

</html>
